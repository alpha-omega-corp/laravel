laravel: '@testbench'

providers:
  - AlphaOmega\UiKit\UiKitServiceProvider
  # The icon set a site installs beside the kit: `<x-kit.icon>` renders nothing without it.
  - BladeUI\Icons\BladeIconsServiceProvider
  - MallardDuck\LucideIcons\BladeLucideIconsServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

# The showcase stores nothing, so it runs with no database at all.
env:
  - APP_LOCALE=fr
  - APP_FALLBACK_LOCALE=fr
  - SESSION_DRIVER=file
  - CACHE_STORE=file
  - QUEUE_CONNECTION=sync

workbench:
  start: '/'
  health: true
  discovers:
    web: true
